name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://example.com

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # 새 글에 서브셋 밖 글자가 있으면 여기서 걸린다.
      # 순수 Node 라 Python 이 필요 없다.
      - name: Font coverage
        run: pnpm fonts:check

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm check:budget

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      # 시각회귀 스냅샷은 플랫폼 종속이라 제외한다 (e2e/visual.spec.ts 주석 참조)
      - name: E2E (a11y + 폰트 + 반응형)
        run: pnpm test:e2e:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
